services:
  # ============================================
  # INFRASTRUCTURE
  # ============================================

  postgres:
    image: postgres:16-alpine
    container_name: casino-engine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - casino-engine-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: casino-engine-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - casino-engine-network

  redis:
    image: redis:7-alpine
    container_name: casino-engine-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - casino-engine-network

  # ============================================
  # APPLICATION
  # ============================================

  casino-engine-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: casino-engine-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_URL=${DB_URL:-jdbc:postgresql://postgres:5432}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
    entrypoint: /app/bin/db-migrate
    networks:
      - casino-engine-network

  casino-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: casino-engine
    restart: unless-stopped
    depends_on:
      casino-engine-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - HTTP_PORT=${HTTP_PORT:-80}
      - GRPC_PORT=${GRPC_PORT:-5050}
      - DB_URL=${DB_URL:-jdbc:postgresql://postgres:5432}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - RABBIT_HOST=${RABBIT_HOST:-rabbitmq}
      - RABBIT_PORT=${RABBIT_PORT:-5672}
      - RABBIT_USER=${RABBIT_USER:-guest}
      - RABBIT_PASSWORD=${RABBIT_PASSWORD:-guest}
      - RABBIT_TLS=${RABBIT_TLS:-false}
      - GAMEHUB_GRPC_HOST=${GAMEHUB_GRPC_HOST:-localhost}
      - GAMEHUB_GRPC_PORT=${GAMEHUB_GRPC_PORT:-50051}
      - GAMEHUB_OPERATOR_ID=${GAMEHUB_OPERATOR_ID:-}
      - GAMEHUB_OPERATOR_KEY=${GAMEHUB_OPERATOR_KEY:-}
      - GAMEHUB_GRPC_PLAINTEXT=${GAMEHUB_GRPC_PLAINTEXT:-true}
    entrypoint: /app/bin/casino-engine
    ports:
      - "${HTTP_PORT:-8080}:${HTTP_PORT:-80}"
      - "${GRPC_PORT:-5050}:${GRPC_PORT:-5050}"
    networks:
      - casino-engine-network

  casino-engine-sync:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: casino-engine-sync
    depends_on:
      casino-engine-migrate:
        condition: service_completed_successfully
      casino-engine:
        condition: service_started
    environment:
      - DB_URL=${DB_URL:-jdbc:postgresql://postgres:5432}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - RABBIT_HOST=${RABBIT_HOST:-rabbitmq}
      - RABBIT_PORT=${RABBIT_PORT:-5672}
      - RABBIT_USER=${RABBIT_USER:-guest}
      - RABBIT_PASSWORD=${RABBIT_PASSWORD:-guest}
      - RABBIT_TLS=${RABBIT_TLS:-false}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - GAMEHUB_GRPC_HOST=${GAMEHUB_GRPC_HOST:-localhost}
      - GAMEHUB_GRPC_PORT=${GAMEHUB_GRPC_PORT:-50051}
      - GAMEHUB_OPERATOR_ID=${GAMEHUB_OPERATOR_ID:-}
      - GAMEHUB_OPERATOR_KEY=${GAMEHUB_OPERATOR_KEY:-}
      - GAMEHUB_GRPC_PLAINTEXT=${GAMEHUB_GRPC_PLAINTEXT:-true}
    entrypoint: /app/bin/sync-catalog
    networks:
      - casino-engine-network

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:

networks:
  casino-engine-network:
    driver: bridge
