syntax = "proto3";

package game.v1;

option java_package = "com.nekgamebling.game.v1";
option java_multiple_files = true;

// ---------------------------------------------------------------------------
// Sportbook service — thin proxy onto the hub's GatewayService.OpenSportbook.
// No player_id = guest: the line is visible, no bets, no session minted anywhere
// (there is no separate anonymous-init RPC any more — the hub's own contract is
// already player_id-optional).
// ---------------------------------------------------------------------------
service SportbookService {
  rpc Open(OpenSportbookCommand) returns (OpenSportbookCommand.Result);
}

message OpenSportbookCommand {
  optional string player_id = 1;

  // Player wallet currency (ISO 4217 / crypto code, e.g. "USD"). Ignored in guest mode.
  string currency = 2;

  string locale = 3;

  message Result {
    // `partners.integration` from the hub — tells the frontend which SDK to load.
    string integration = 1;

    // Vendor-specific launch data (apiUrl, partnerId, token, currency...).
    map<string, string> data = 2;
  }
}
