syntax = "proto3";

package game.v1;

option java_package = "com.nekgamebling.game.v1";
option java_multiple_files = true;

import "game/v1/dto/common.dto.proto";
import "google/protobuf/struct.proto";

// Тонкий прокси на GatewayService хаба: состоянием гранта владеет GameHub, casino-engine своей
// записи о нём не держит.
//
// Контракт — ИСХОДНЫЙ, вместе с номерами полей. Грант называется ссылкой ВЫЗЫВАЮЩЕГО: она уходит
// вендору и ею же грант назван в спин- и раунд-событиях (`freespinId` на проводе). Без неё
// владелец акции не узнаёт на спине собственный грант — не считает отыгрыш и не платит по своим
// правилам. Переномерованные поля здесь стоят дороже переименованных: чужие байты молча лягут в
// соседнее поле того же типа, и ссылка приедет как валюта.
service FreespinService {
  rpc GetPreset(GetFreespinPresetQuery) returns (GetFreespinPresetQuery.Result);

  rpc Create(CreateFreespinCommand) returns (Empty);

  rpc Cancel(CancelFreespinCommand) returns (Empty);
}

message GetFreespinPresetQuery {
  string game_identity = 1;

  message Result {
    google.protobuf.Struct preset = 1;
  }
}

message CreateFreespinCommand {
  string game_identity = 1;

  string player_id = 2;

  // Ссылка вызывающего. Ею грант представлен вендору и ею же он назван на событиях.
  string reference_id = 3;

  string currency = 4;

  // Окно гранта, локальные ISO-даты без зоны, читаются как UTC.
  string start_at = 5;

  string end_at = 6;

  google.protobuf.Struct preset_values = 7;

  int64 spin_amount = 8;

  int32 spin_count = 9;
}

message CancelFreespinCommand {
  string game_identity = 1;

  string reference_id = 2;
}
