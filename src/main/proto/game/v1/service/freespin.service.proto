syntax = "proto3";

package game.v1;

option java_package = "com.nekgamebling.game.v1";
option java_multiple_files = true;

import "game/v1/dto/common.dto.proto";
import "google/protobuf/struct.proto";

// Thin proxy onto the hub's GatewayService — GameHub is the sole source of grant state, casino-engine
// keeps no local record. Create mints and returns the grant id; the caller must hold onto it for
// Cancel and for recognising the grant on spin/round events (freespinId on the wire).
service FreespinService {
  rpc GetPreset(GetFreespinPresetQuery) returns (GetFreespinPresetQuery.Result);

  rpc Create(CreateFreespinCommand) returns (CreateFreespinCommand.Result);

  rpc Cancel(CancelFreespinCommand) returns (Empty);
}

message GetFreespinPresetQuery {
  string game_identity = 1;

  message Result {
    google.protobuf.Struct preset = 1;
  }
}

message CreateFreespinCommand {
  string game_identity = 1;

  string player_id = 2;

  string currency = 3;

  google.protobuf.Struct preset_values = 4;

  int64 spin_amount = 5;

  int32 spin_count = 6;

  message Result {
    // The hub's own grant id.
    string id = 1;
  }
}

message CancelFreespinCommand {
  // The id CreateFreespinCommand.Result returned.
  string id = 1;
}
