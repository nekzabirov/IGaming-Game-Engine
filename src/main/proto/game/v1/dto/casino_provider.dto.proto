syntax = "proto3";

package game.v1;

option java_multiple_files = true;
option java_package = "com.nekgamebling.game.v1";

message CasinoProviderDto {
  string identity = 1;

  string name = 2;

  map<string, string> images = 3;

  int32 order = 4;

  bool active = 5;

  repeated string blocked_country = 7;

  repeated string tags = 8;

  // The LOCAL half of `tags` — see CasinoGameDto.custom_tags for why the seam is on the wire.
  repeated string custom_tags = 9;
}
