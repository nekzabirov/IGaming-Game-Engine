syntax = "proto3";

package gamehub.v1;

// Реализуется ОПЕРАТОРОМ, вызывается хабом. Адрес берётся из `operators.webhook_url`.
//
// Хаб не держит денег и не считает баланс. Он приводит колбэк вендора к этим пяти вызовам, зовёт
// оператора и переводит ответ обратно в протокол вендора. Всё, что знает про деньги, — здесь.
//
// АУТЕНТИФИКАЦИЯ — В ОБЕ СТОРОНЫ. Хаб представляется на КАЖДОМ вызове парой метаданных
// `x-operator-id` (identity оператора) и `x-operator-key` (его секрет) — той же самой, какой
// оператор представляется хабу в `GatewayService`. Оператор ОБЯЗАН её сверять: без этого кто
// угодно, узнав адрес кошелька, двигал бы по нему деньги. Секрет ездит в метаданных, а не в теле,
// потому что тело попадает в логи трассировки целиком.
//
// ОТКАЗЫ. Причина отказа называется машиночитаемым кодом в метаданных `x-error-code` —
// `INSUFFICIENT_FUNDS`, `LIMIT_EXCEEDED`, `PLAYER_BLOCKED`, `PLAYER_NOT_FOUND`,
// `CURRENCY_MISMATCH`, `INTERNAL`. Кода статуса недостаточно: под `FAILED_PRECONDITION` лежат и
// нехватка денег, и превышенный лимит, а игроку по ним показывают разные окна. `INTERNAL` значит
// «не знаю, чем кончилось», и по нему часть вендоров начинает цикл отката — на отказе по существу
// его отдавать нельзя. Словарь целиком: docs/ERRORS.md.
//
// ИДЕМПОТЕНТНОСТЬ. `id` уникален на каждую ногу. Оператор ОБЯЗАН быть идемпотентен по нему:
// повтор не двигает денег и отвечает тем же результатом, что и первый вызов. Хаб повторяет:
// вендоры шлют колбэк заново по таймауту, и на нашей стороне это неотличимо от первого раза,
// пока ответ не получен.
//
// НАПРАВЛЕНИЕ ЗАДАЁТ МЕТОД, а не знак: `PlaceSpin` забирает, `SettleSpin` отдаёт, `RollbackSpin`
// двигает противоположно той ноге, которую отменяет. Поэтому `amount` везде положительный.
service WebhookService {
  // Баланс игрока. Вендор спрашивает его прямо посреди игры.
  rpc Balance(BalanceRequest) returns (BalanceResponse);

  // Ставка. Единственная нога, которую оператор вправе отклонить: денег может не хватить.
  rpc PlaceSpin(PlaceSpinRequest) returns (SpinResponse);

  // Выигрыш.
  rpc SettleSpin(SettleSpinRequest) returns (SpinResponse);

  // Отмена ноги по её `id`. Отменять нечего, если ноги не было: оператор отвечает успехом, а не
  // ошибкой — вендор повторяет отмену до тех пор, пока не получит ответ.
  rpc RollbackSpin(RollbackSpinRequest) returns (SpinResponse);

  // Раунд закрыт: больше ног по нему не придёт. Денег не двигает.
  rpc CloseRound(CloseRoundRequest) returns (CloseRoundResponse);
}

message BalanceRequest {
  // Игрок словами ОПЕРАТОРА — тот, кого он передал в LaunchCasino.
  string player_id = 1;

  string currency = 2;
}

message BalanceResponse {
  Balance balance = 1;
}

// `real` и `bonus` — две разные суммы, а не часть и целое. Что из них тратится первым — политика
// оператора; хаб их только показывает вендору.
message Balance {
  // nano.
  int64 real = 1;

  // nano.
  int64 bonus = 2;

  string currency = 3;
}

message PlaceSpinRequest {
  // Идентификатор ноги у нас. Он же — ключ идемпотентности оператора.
  string id = 1;

  // Раунд у нас. Ноги одного раунда несут один и тот же.
  string round_id = 2;

  string player_id = 3;

  // Слаг игры, как он пришёл в ListCasino.
  string game = 4;

  // Ставка, nano, положительная.
  int64 amount = 5;

  string currency = 6;

  // Грант, если эта нога — свободный раунд. Платить ли за него — политика оператора; хаб только
  // сообщает, что нога принадлежит гранту.
  optional string freespin_id = 7;
}

message SettleSpinRequest {
  string id = 1;

  string round_id = 2;

  // Игрок здесь есть, хотя раунд его уже называет: выигрыш свободного раунда приходит БЕЗ ставки
  // перед ним, и тогда у оператора нет строки раунда, из которой игрока можно достать.
  string player_id = 3;

  string game = 4;

  // Выигрыш, nano, положительный.
  int64 amount = 5;

  string currency = 6;

  optional string freespin_id = 7;
}

message RollbackSpinRequest {
  // `id` ОТМЕНЯЕМОЙ ноги — той, что уже приходила в PlaceSpin или SettleSpin.
  string id = 1;
}

message SpinResponse {
  // Идентификатор движения у оператора. Хаб хранит его для сверки.
  string id = 1;

  // Баланс ПОСЛЕ движения: именно его вендор показывает игроку. Отдельный запрос за балансом
  // после каждой ноги удваивал бы число вызовов на каждом спине.
  Balance balance = 2;
}

message CloseRoundRequest {
  string round_id = 1;
}

message CloseRoundResponse {}
