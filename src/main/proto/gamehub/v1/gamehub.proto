syntax = "proto3";

package gamehub.v1;

import "gamehub/v1/common.proto";

// Implemented by the HUB, called by an operator.
//
// Every call authenticates with metadata `x-operator-id` (the operator's
// identity) and `x-operator-key` (its secret). Errors carry the machine-readable
// reason in metadata `x-error-code` — see docs/ERRORS.md.
service GameHubService {
  // Opens a real-money session and returns the provider's launch URL.
  rpc OpenGame(OpenGameRequest) returns (OpenGameResponse);

  // Returns a demo launch URL. No session, no player, no money.
  rpc OpenGameDemo(OpenGameDemoRequest) returns (OpenGameResponse);

  // Grants free rounds at the provider. `external_id` is the operator's own
  // reference and is echoed back on every spin the grant pays for.
  rpc CreateFreespin(CreateFreespinRequest) returns (Empty);

  // Revokes a grant by the operator's reference.
  rpc CancelFreespin(CancelFreespinRequest) returns (Empty);

  // Every game the operator can serve — that is, every game whose provider the
  // operator has routed to an aggregator.
  rpc GameList(Empty) returns (GameListResponse);
}

message OpenGameRequest {
  string game = 1;

  string player_id = 2;

  string currency = 3;

  string lang = 4;

  Platform platform = 5;

  // The operator's own handle for this launch, echoed back on every spin and
  // balance call of the session. Operators that keep a session of their own use
  // it to tie a callback back to that row exactly, instead of guessing from
  // (player, game) and getting it wrong the moment a player opens two tabs.
  optional string session_ref = 6;
}

message OpenGameDemoRequest {
  string game = 1;

  string currency = 2;

  string lang = 3;

  Platform platform = 4;
}

message OpenGameResponse {
  string url = 1;
}

message CreateFreespinRequest {
  string game = 1;

  // Stake per free round, nano.
  int64 amount = 2;

  int32 count = 3;

  // Vendor-specific knobs (e.g. paylines). Keys differ per aggregator.
  map<string, string> presets = 4;

  string player_id = 5;

  string currency = 6;

  // The operator's reference. Unique per operator; echoed on paid-out spins.
  string external_id = 7;
}

message CancelFreespinRequest {
  string external_id = 1;
}

message GameListResponse {
  repeated Game games = 1;
}

message Game {
  string identity = 1;

  string name = 2;

  // key -> URL
  map<string, string> images = 3;

  repeated string tags = 4;

  bool freespin_enable = 5;

  bool demo_enable = 6;

  bool bonus_buy_enable = 7;

  repeated string locales = 8;

  repeated Platform platforms = 9;

  int32 play_lines = 10;

  Provider provider = 11;
}

message Provider {
  string identity = 1;

  string name = 2;

  map<string, string> images = 3;

  repeated string tags = 4;
}
